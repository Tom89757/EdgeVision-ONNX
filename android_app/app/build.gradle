plugins {
    id "com.android.application"
}

// 编译日期（yyyyMMdd），写入 APK 文件名与 BuildConfig
def buildDate = new Date().format("yyyyMMdd")

android {
    namespace "com.edgevision.onnx"
    compileSdk 34

    defaultConfig {
        applicationId "com.edgevision.onnx"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        buildConfigField "String", "BUILD_DATE", "\"${buildDate}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
    }

    // APK 文件名包含应用名、版本与编译日期：EdgeVision-v<版本>-<日期>-<buildType>.apk
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "EdgeVision-v${variant.versionName}-${buildDate}-${variant.name}.apk"
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.exifinterface:exifinterface:1.3.7"
    implementation "com.google.android.material:material:1.12.0"

    implementation "androidx.camera:camera-core:1.4.0"
    implementation "androidx.camera:camera-camera2:1.4.0"
    implementation "androidx.camera:camera-lifecycle:1.4.0"
    implementation "androidx.camera:camera-view:1.4.0"

    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.22.0"
}
